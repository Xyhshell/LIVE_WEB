<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>登录 · 预览</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0d1117;
  --bg-subtle:#161b22;
  --bg-inset:#010409;
  --bg-elevated:#21262d;
  --border:#30363d;
  --border-muted:#21262d;
  --fg:#e6edf3;
  --fg-muted:#8b949e;
  --fg-subtle:#6e7681;
  --accent:#58a6ff;
  --accent-emphasis:#1f6feb;
  --success:#3fb950;
  --success-emphasis:#238636;
  --danger:#f85149;
  --radius:6px;
  --radius-lg:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",
       Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.login-wrap{width:min(340px,100%)}
.login-logo{
  width:48px;height:48px;border-radius:50%;margin:0 auto 20px;
  background:var(--bg-subtle);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.login-logo::after{
  content:"";width:16px;height:16px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px var(--bg),0 0 12px var(--accent-emphasis);
}
h1{
  margin:0 0 6px;font-size:20px;font-weight:600;
  text-align:center;letter-spacing:-0.01em;
}
.sub{
  margin:0 0 20px;text-align:center;
  color:var(--fg-muted);font-size:13px;
}

.card{
  background:var(--bg-subtle);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:16px 20px 20px;
}

.form-group{margin-bottom:14px}
.form-group:last-of-type{margin-bottom:0}
label{
  display:block;font-size:12px;font-weight:600;
  color:var(--fg);margin-bottom:6px;
}
label .req{color:var(--danger);margin-left:2px}
input{
  width:100%;padding:5px 12px;height:32px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--fg);font-size:14px;font-family:inherit;
  transition:border-color .15s, box-shadow .15s;
}
input::placeholder{color:var(--fg-subtle)}
input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(88,166,255,0.3);
}
input[type=text].totp{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,monospace;
  font-size:16px;letter-spacing:8px;text-align:center;padding-left:8px;
}
button{
  width:100%;margin-top:20px;padding:0 16px;height:32px;
  border:1px solid rgba(240,246,252,0.1);
  border-radius:var(--radius);
  background:var(--success-emphasis);color:#fff;
  font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:background .15s;
}
button:hover{background:#2ea043}
button:active{background:#238636}

.err{
  margin-top:16px;padding:8px 12px;
  border-radius:var(--radius);
  font-size:13px;
  background:rgba(248,81,73,0.1);
  border:1px solid rgba(248,81,73,0.4);
  color:var(--danger);
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo"></div>
  <h1>登录 · 预览</h1>
  <p class="sub">请输入访问凭证以继续</p>

  <form class="card" method="POST" action="/login" autocomplete="off">
    <div class="form-group">
      <label for="u">用户名<span class="req">*</span></label>
      <input id="u" name="username" autocomplete="username" required autofocus>
    </div>

    <div class="form-group">
      <label for="p">密码<span class="req">*</span></label>
      <input id="p" name="password" type="password"
             autocomplete="current-password" required>
    </div>

    <div class="form-group">
      <label for="t">口令<span class="req">*</span></label>
      <input id="t" name="totp" type="text" class="totp"
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             placeholder="000000" required>
    </div>

    <button type="submit">登录</button>
    <!--ERR-->
  </form>
</div>
</body>
</html>
